<svg xmlns="http://www.w3.org/2000/svg"
     width="210mm" height="297mm" viewBox="0 0 210 297">
  <!--
    模擬き裂テスト用ターゲットシート（A4・原寸）

    必ず「実際のサイズ / 100% / 拡大縮小なし」で印刷してください。
    プリンタの既定は「用紙に合わせる」で約96%に縮みます。
    印刷後、下のスケールバーを定規で測って100mmであることを確認してください。

    使い方は右下の手順を参照。
  -->
  <rect width="210" height="297" fill="#ffffff"/>

  <!-- ── 見出し ── -->
  <text x="105" y="14" font-family="sans-serif" font-size="5.5" font-weight="bold"
        text-anchor="middle" fill="#000">模擬き裂 ターゲットシート</text>
  <text x="105" y="21" font-family="sans-serif" font-size="3.2"
        text-anchor="middle" fill="#444">A4 原寸印刷（100%・用紙に合わせない）／ ターゲット径 15mm</text>

  <!-- ── 印刷倍率の検証用スケールバー ── -->
  <g stroke="#000" stroke-width="0.4">
    <line x1="55" y1="32" x2="155" y2="32"/>
    <line x1="55" y1="29.5" x2="55" y2="34.5"/>
    <line x1="155" y1="29.5" x2="155" y2="34.5"/>
    <line x1="80" y1="30.5" x2="80" y2="33.5"/>
    <line x1="105" y1="30" x2="105" y2="34"/>
    <line x1="130" y1="30.5" x2="130" y2="33.5"/>
  </g>
  <text x="105" y="39" font-family="sans-serif" font-size="3"
        text-anchor="middle" fill="#000">↑ この線が正確に 100.0mm なら印刷倍率OK（25mm刻み）</text>

  <!-- ── 切断線（模擬き裂）── -->
  <line x1="105" y1="52" x2="105" y2="232" stroke="#000" stroke-width="0.3"
        stroke-dasharray="3 2"/>
  <text x="105" y="50" font-family="sans-serif" font-size="3"
        text-anchor="middle" fill="#000">✂ ここで切る（模擬き裂）</text>

  <!-- ── 固定側（A）: 岩塊側 ── -->
  <text x="52" y="60" font-family="sans-serif" font-size="4" font-weight="bold" fill="#000">固定側 A</text>
  <text x="52" y="65" font-family="sans-serif" font-size="2.8" fill="#444">壁に貼って動かさない</text>

  <circle cx="45" cy="90"  r="7.5" fill="#000"/>
  <circle cx="45" cy="150" r="7.5" fill="#000"/>
  <circle cx="45" cy="210" r="7.5" fill="#000"/>
  <text x="60" y="91"  font-family="sans-serif" font-size="4" fill="#000">A1</text>
  <text x="60" y="151" font-family="sans-serif" font-size="4" fill="#000">A2</text>
  <text x="60" y="211" font-family="sans-serif" font-size="4" fill="#000">A3</text>

  <!-- ── 可動側（B）: き裂の向こう側 ── -->
  <text x="128" y="60" font-family="sans-serif" font-size="4" font-weight="bold" fill="#000">可動側 B</text>
  <text x="128" y="65" font-family="sans-serif" font-size="2.8" fill="#444">既知量だけ動かす</text>

  <circle cx="165" cy="90"  r="7.5" fill="#000"/>
  <circle cx="165" cy="150" r="7.5" fill="#000"/>
  <circle cx="165" cy="210" r="7.5" fill="#000"/>
  <text x="145" y="91"  font-family="sans-serif" font-size="4" text-anchor="end" fill="#000">B1</text>
  <text x="145" y="151" font-family="sans-serif" font-size="4" text-anchor="end" fill="#000">B2</text>
  <text x="145" y="211" font-family="sans-serif" font-size="4" text-anchor="end" fill="#000">B3</text>

  <!-- ── 設計寸法 ── -->
  <g stroke="#888" stroke-width="0.25" stroke-dasharray="1.5 1.5">
    <line x1="45" y1="90" x2="165" y2="90"/>
    <line x1="45" y1="90" x2="45" y2="210"/>
  </g>
  <text x="105" y="87" font-family="sans-serif" font-size="3"
        text-anchor="middle" fill="#666">A1–B1 = 120.0mm</text>
  <text x="42" y="150" font-family="sans-serif" font-size="3"
        text-anchor="end" fill="#666" transform="rotate(-90 42 150)">A1–A3 = 120.0mm</text>

  <!-- ── 手順 ── -->
  <text x="14" y="245" font-family="sans-serif" font-size="4" font-weight="bold" fill="#000">テスト手順</text>
  <text x="14" y="252" font-family="sans-serif" font-size="3.1" fill="#000">1. 破線で切り、A側だけを壁や板にしっかり貼る（動かないように）</text>
  <text x="14" y="257" font-family="sans-serif" font-size="3.1" fill="#000">2. B側をA側の横に、隙間を空けて仮止めする</text>
  <text x="14" y="262" font-family="sans-serif" font-size="3.1" fill="#000">3. A1–A3 の実距離をノギスで実測する（印刷倍率の誤差を吸収するため）</text>
  <text x="14" y="267" font-family="sans-serif" font-size="3.1" fill="#000">4. 動かさずに10〜20枚撮る → σ（測定ノイズ）が出る</text>
  <text x="14" y="272" font-family="sans-serif" font-size="3.1" fill="#000">5. B側だけを既知量ずらす（すきまゲージ0.10mm等を挟む）→ もう10枚撮る</text>
  <text x="14" y="277" font-family="sans-serif" font-size="3.1" fill="#000">6. ツールが「その既知量」を当てられるか確認する</text>
  <text x="14" y="284" font-family="sans-serif" font-size="2.9" fill="#666">※ 設計値120mmは印刷倍率でずれます。必ず実測値を使ってください。</text>
  <text x="14" y="289" font-family="sans-serif" font-size="2.9" fill="#666">※ A側の3点は剛体基準です。カメラの動きはこの3点から除去されます。</text>

  <!-- ── 四隅の見当（用紙が正しく出たかの確認）── -->
  <g stroke="#000" stroke-width="0.3" fill="none">
    <path d="M8 8 h6 M8 8 v6"/>
    <path d="M202 8 h-6 M202 8 v6"/>
    <path d="M8 289 h6 M8 289 v-6"/>
    <path d="M202 289 h-6 M202 289 v-6"/>
  </g>
</svg>
