name: Pages

# web/ 以下（σ実測ツール）を GitHub Pages で公開する。
# サーバー処理は無く、画像はブラウザ内で完結するため静的配信で足ります。

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 既定ブランチのときだけ公開する（作業ブランチを誤って出さないため）
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 初回のみ、リポジトリ側で Pages を有効にしておく必要があります。
      #   Settings → Pages → Build and deployment → Source を "GitHub Actions" に
      # GITHUB_TOKEN には Pages サイトを新規作成する権限が無いため、
      # ここを自動化することはできません（enablement: true でも
      # "Resource not accessible by integration" で失敗します）。
      - name: Pages を設定
        uses: actions/configure-pages@v5

      - name: web/ をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 公開
        id: deploy
        uses: actions/deploy-pages@v4
