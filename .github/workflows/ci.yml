name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  crackcore-tests:
    name: CrackCore のテスト
    # macos-14 の既定 Xcode は 15.4 で、最近の XcodeGen が生成する
    # pbxproj 形式（objectVersion 77）を読めない。Xcode 16 系が必要。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift のバージョン
        run: swift --version

      # 計測ロジックは ARKit に依存しないので、実機なしで検証できる
      - name: swift test
        run: swift test --enable-code-coverage

  app-build:
    name: iOS アプリのビルド
    # macos-14 の既定 Xcode は 15.4 で、最近の XcodeGen が生成する
    # pbxproj 形式（objectVersion 77）を読めない。Xcode 16 系が必要。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen を入れる
        run: brew install xcodegen

      - name: プロジェクトを生成
        run: xcodegen generate

      # 実機向けにビルドする。シミュレータ SDK には Object Capture など
      # 一部の API が無く、実際に配布する構成とも食い違うため。
      # -quiet を付けないと、エラー本文が xcodebuild の冗長出力に埋もれる。
      - name: 実機向けにビルド
        run: |
          xcodebuild build \
            -project CrackScan.xcodeproj \
            -scheme CrackScan \
            -destination 'generic/platform=iOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
