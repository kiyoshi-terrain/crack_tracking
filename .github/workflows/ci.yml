name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  crackcore-tests:
    name: CrackCore のテスト
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift のバージョン
        run: swift --version

      # 計測ロジックは ARKit に依存しないので、実機なしで検証できる
      - name: swift test
        run: swift test --enable-code-coverage

  app-build:
    name: iOS アプリのビルド
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen を入れる
        run: brew install xcodegen

      - name: プロジェクトを生成
        run: xcodegen generate

      - name: シミュレータ向けにビルド
        run: |
          xcodebuild build \
            -project CrackScan.xcodeproj \
            -scheme CrackScan \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
