# XcodeGen 用のプロジェクト定義。
#   brew install xcodegen && xcodegen generate
# で CrackScan.xcodeproj を生成します。
#
# .xcodeproj をリポジトリに入れないのは、pbxproj のコンフリクト解決が
# 現実的でないためです。プロジェクト定義はこの1ファイルに集約します。
#
# CrackCore は Xcode 上では framework ターゲットとしてビルドします
# （ルートの Package.swift は `swift test` を CI で直接回すためのもので、
#  両者が同じ Sources/CrackCore を参照します）。
name: CrackScan
options:
  bundleIdPrefix: jp.example.crackscan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja
  groupSortPosition: top

# 署名の Team ID など、人ごとに違う設定は Local.xcconfig に書く（このファイルは触らない）。
#   cp Local.xcconfig.example Local.xcconfig   → DEVELOPMENT_TEAM を自分の Team ID に
# Config/Base.xcconfig が Local.xcconfig を `#include?` で任意に取り込む。
# 参照先が無いファイルを直接指すと Xcode は "Unable to open base configuration reference
# file" でビルドを止める（警告ではなくエラー。CI で実際に止まった）ので、必ず存在する
# Base.xcconfig を指し、無くてもよい方は #include? に任せる。
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # 計測アルゴリズム層。ARKit / UIKit に依存しない。
  CrackCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CrackCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.crackscan.core
        PRODUCT_NAME: CrackCore
        DEFINES_MODULE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # フレームワークにも Info.plist が要る。無いと実機向けの署名で
        # "CrackCore.framework did not contain an Info.plist" で止まる
        # （署名を切っている CI のビルドでは通ってしまうので気づけない）。
        # ファイルを置かずに Xcode に生成させる
        GENERATE_INFOPLIST_FILE: YES
      configs:
        # 純 Swift の画像処理は -Onone だと 10〜30 倍遅い（配列添字ごとに関数呼び出し）。
        # Xcode の ▶ は Debug なので、計測ロジックだけは Debug でも最適化して
        # 現場で「解析中…」が 1 分続くのを避ける。アプリ側の UI はデバッグしやすいまま
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  CrackScan:
    type: application
    platform: iOS
    sources:
      - path: App/CrackScan
    dependencies:
      - target: CrackCore
        embed: true
    info:
      path: App/CrackScan/Info.plist
      properties:
        CFBundleDisplayName: 亀裂スキャン
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 構造物のひび割れを撮影・計測するためにカメラを使用します。
        NSPhotoLibraryAddUsageDescription: 撮影した写真と点検調書を写真ライブラリに保存します。
        NSLocationWhenInUseUsageDescription: 撮影位置を点検記録に残すために位置情報を使用します。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.crackscan
        TARGETED_DEVICE_FAMILY: "1,2"

  # Xcode から計測ロジックのテストを走らせたいとき用。
  # CI では `swift test` を使うので、こちらは開発時の利便性のため。
  CrackCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CrackCoreTests
    dependencies:
      - target: CrackCore

schemes:
  CrackScan:
    build:
      targets:
        CrackScan: all
    run:
      config: Debug
    archive:
      config: Release

  CrackCore:
    build:
      targets:
        CrackCore: all
        CrackCoreTests: [test]
    test:
      config: Debug
      targets:
        - CrackCoreTests
